name: Build NetMonitor Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Prepare Android project
        run: |
          python3 prepare_project.py
          echo "--- Java sources ---"
          find app/src/main/java -type f -maxdepth 10 -print
          test -f app/src/main/java/com/netmonitor/pro/MonitorVpnService.java
          grep -q "final class NativeTunnelService" app/src/main/java/com/netmonitor/pro/MonitorVpnService.java

      - name: Fetch and build real tun2socks engine
        run: |
          git clone --depth 1 --branch 2.17.0 --recursive https://github.com/heiher/hev-socks5-tunnel.git native/hev-socks5-tunnel
          cat > native/hev-socks5-tunnel/Application.mk <<'EOF'
          APP_OPTIM := release
          APP_PLATFORM := android-29
          APP_ABI := armeabi-v7a arm64-v8a x86 x86_64
          APP_CFLAGS := -O3 -DFD_SET_DEFINED -DSOCKLEN_T_DEFINED -DPKGNAME=com/netmonitor/pro -DCLSNAME=NativeTunnelService
          APP_SUPPORT_FLEXIBLE_PAGE_SIZES := true
          NDK_TOOLCHAIN_VERSION := clang
          EOF
          export PATH="$ANDROID_HOME/ndk/27.2.12479018:$PATH"
          ndk-build -C native/hev-socks5-tunnel NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk
          mkdir -p app/src/main/jniLibs
          cp -R native/hev-socks5-tunnel/libs/* app/src/main/jniLibs/

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
